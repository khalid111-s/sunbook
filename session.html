<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Session - The Sun Book</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/sun-icon.png">
  <style>
    body { margin: 0; background: #030406; overflow: hidden; }
    #jitsi-container { width: 100vw; height: calc(100vh - 52px); margin-top: 52px; }
    .session-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(3,4,6,0.9); border-bottom: 1px solid rgba(216,176,86,0.2);
      padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
    }
    .session-header h3 { color: var(--gold-color); margin: 0; font-family: var(--font-logo); }
    .session-header .btn-end {
      background: #ff4d4d; color: #fff; border: none; padding: 8px 20px;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

<div class="session-header">
  <h3 id="sessionTitle">Live Session</h3>
  <button class="btn-end" onclick="endCall()">End Call</button>
</div>

<div id="jitsi-container"></div>

<script src="https://meet.jit.si/external_api.js"></script>
<script src="js/api.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const sessionId = urlParams.get('id');
let jitsiApi = null;

async function initMeeting() {
  const token = localStorage.getItem('sunbook_token');
  if (!token || token === 'social_dummy_token' || !sessionId) {
    alert('Please sign in first');
    window.location.href = 'login.html';
    return;
  }

  try {
    const { data } = await api.getSession(sessionId);
    const session = data.session || data;
    const cfg = data.meetingConfig;
    const userName = localStorage.getItem('sunbook_username') || 'Sunbook User';

    document.getElementById('sessionTitle').innerText = session.subject || 'Live Session';

    const domain = cfg?.domain || 'meet.jit.si';
    const roomName = cfg?.roomName || session.jitsiRoomName;

    const options = {
      roomName,
      parentNode: document.getElementById('jitsi-container'),
      width: '100%',
      height: '100%',
      configOverwrite: cfg?.configOverwrite || {
        startWithAudioMuted: false,
        startWithVideoMuted: false,
        prejoinPageEnabled: false,
      },
      interfaceConfigOverwrite: cfg?.interfaceConfigOverwrite || {
        SHOW_JITSI_WATERMARK: false,
        SHOW_WATERMARK_FOR_GUESTS: false,
      },
      userInfo: cfg?.userInfo || { displayName: userName },
      lang: 'en',
    };

    if (cfg?.jwt) options.jwt = cfg.jwt;

    jitsiApi = new JitsiMeetExternalAPI(domain, options);

    jitsiApi.addEventListener('videoConferenceJoined', () => {
      api.joinSession(sessionId).catch(() => {});
    });

    jitsiApi.addEventListener('readyToClose', endCall);
  } catch (err) {
    alert('Error: ' + err.message);
    window.location.href = 'profile.html';
  }
}

async function endCall() {
  if (jitsiApi) {
    jitsiApi.dispose();
    jitsiApi = null;
  }
  try {
    await api.endSession(sessionId);
  } catch (e) {}
  window.location.href = 'profile.html';
}

initMeeting();
</script>

</body>
</html>
