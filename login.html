<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - The Sun Book</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/sun-icon.png">
    <!-- تسجيل الدخول بجوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- تسجيل الدخول بفيسبوك -->
    <!-- ⚠️ مهم: window.fbAsyncInit لازم يتعرّف هنا قبل تحميل سكريبت الـ SDK نفسه،
         عشان الـ SDK شغال async وممكن يخلص تحميل وينده على fbAsyncInit قبل ما نعرّفه
         لو كان الكود ده تحت في آخر الصفحة (ده اللي كان بيسبب إيرور "init not called with valid version") -->
    <script>
      const FACEBOOK_APP_ID = '1050229990822438';
      window.fbAsyncInit = function () {
        if (FACEBOOK_APP_ID.startsWith('YOUR_')) return;
        FB.init({ appId: FACEBOOK_APP_ID, cookie: true, xfbml: false, version: 'v19.0' });
      };
    </script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</head>
<body>
<div data-include="components/header.html"></div>

<!-- قسم تسجيل الدخول -->
<section class="auth-section reveal">
    <div class="auth-card">
        
        <!-- أزرار التبديل -->
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('signin')">Sign In</div>
            <div class="auth-tab" onclick="switchTab('register')">Register</div>
        </div>

        <!-- فورم تسجيل الدخول -->
        <form id="signinForm" class="auth-form active" onsubmit="handleAuth(event, 'signin')">
            <input type="email" class="auth-input" placeholder="Email Address" required>
            <input type="password" class="auth-input" placeholder="Password" required>
            <div class="auth-action-row">
                <a href="#" class="inline-link-clean" style="color: var(--gold-color); font-size: 0.85rem;">Forgot Password?</a>
            </div>
            <button type="submit" class="btn-shop auth-submit-btn">Sign In</button>
        </form>

        <!-- فورم إنشاء الحساب -->
        <form id="registerForm" class="auth-form" onsubmit="handleAuth(event, 'register')">
            <input type="text" id="registerName" class="auth-input" placeholder="Full Name" required>
            <input type="email" class="auth-input" placeholder="Email Address" required>
            <input type="password" class="auth-input" placeholder="Password" required>
            <button type="submit" class="btn-shop auth-submit-btn">Create Account</button>
        </form>

        <!-- الفاصل وطرق السوشيال ميديا -->
        <div class="social-divider"><span>or continue with</span></div>
        
        <div class="social-login-container">

            <!-- زرار جوجل - شكله مطابق لزرار الفيسبوك، وزرار جوجل الحقيقي شفاف فوقه بالظبط عشان الضغطة تفتح نافذة جوجل الحقيقية -->
            <div class="social-btn google-btn-shell">
                <svg viewBox="0 0 488 512" xmlns="http://www.w3.org/2000/svg">
                    <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/>
                </svg>
                Google
                <div id="googleBtnContainer" class="google-btn-overlay"></div>
            </div>

            <!-- زرار فيسبوك -->
            <button type="button" class="social-btn" onclick="facebookSignIn()">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Facebook
            </button>

        </div>
        
    </div>
</section>

<!-- الخط الفاصل قبل الفوتر -->
<div class="elegant-section-divider reveal">
    <div class="divider-line-left"></div>
    <div class="divider-center-icon">
        <span class="hollow-dot"></span>
        <div class="sun-emblem"><img src="assets/sun-icon.png" alt="Sun icon" /></div>
        <span class="hollow-dot"></span>
    </div>
    <div class="divider-line-right"></div>
</div>

<div data-include="components/footer.html"></div>

<script src="components/loader.js"></script>
<script src="js/script.js"></script>
<script src="js/api.js"></script>
<script>
// ─── تبديل التابز ─────────────────────────────────────
function switchTab(tabName) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
  
  if (tabName === 'signin') {
    document.querySelectorAll('.auth-tab')[0]?.classList.add('active');
    document.getElementById('signinForm')?.classList.add('active');
  } else {
    document.querySelectorAll('.auth-tab')[1]?.classList.add('active');
    document.getElementById('registerForm')?.classList.add('active');
  }
}

// ─── تسجيل الدخول / إنشاء حساب ────────────────────────
async function handleAuth(event, type) {
  event.preventDefault();
  
  const form = event.target;
  const email = form.querySelector('input[type="email"]')?.value;
  const password = form.querySelector('input[type="password"]')?.value;

  try {
    let res;
    if (type === 'signin') {
      res = await api.login(email, password);
    } else {
      const name = document.getElementById('registerName')?.value || 'User';
      const phone = ''; // ممكن تضيف حقل تليفون لو حابب
      res = await api.register(name, email, password, phone);
    }

    // حفظ البيانات
    localStorage.setItem('sunbook_token', res.data.token);
    localStorage.setItem('sunbook_username', res.data.name);
    localStorage.setItem('sunbook_user_id', res.data._id);

    // توجيه
    const redirect = localStorage.getItem('sunbook_redirect_after_login') || 'index.html';
    localStorage.removeItem('sunbook_redirect_after_login');
    window.location.href = redirect;

  } catch (err) {
    if (typeof showToast === 'function') showToast(err.message, 'error');
    else alert(err.message);
  }
}

// ─── سوشيال لوجين حقيقي (جوجل + فيسبوك) ────────────────
// ⚠️ حط قيمك الحقيقية هنا بعد ما تجيبها من Google Cloud Console
// (FACEBOOK_APP_ID اتعرّف فوق في الـ <head> قبل ما نحمّل سكريبت الفيسبوك)
const GOOGLE_CLIENT_ID = '853924471375-ebuuh64e5pqh5bhhiggfsfh71k5caf1h.apps.googleusercontent.com';

// نتيجة موحدة لأي طريقة دخول (عادي / جوجل / فيسبوك)
function handleSocialSuccess(res) {
  localStorage.setItem('sunbook_token', res.data.token);
  localStorage.setItem('sunbook_username', res.data.name);
  localStorage.setItem('sunbook_user_id', res.data._id);

  const redirect = localStorage.getItem('sunbook_redirect_after_login') || 'index.html';
  localStorage.removeItem('sunbook_redirect_after_login');
  window.location.href = redirect;
}

// ─── جوجل ──────────────────────────────────────────────
async function onGoogleResponse(response) {
  try {
    const res = await api.googleLogin(response.credential);
    handleSocialSuccess(res);
  } catch (err) {
    if (typeof showToast === 'function') showToast(err.message, 'error');
    else alert(err.message);
  }
}

if (GOOGLE_CLIENT_ID.includes('.apps.googleusercontent.com') && !GOOGLE_CLIENT_ID.startsWith('YOUR_')) {
  window.addEventListener('load', function () {
    if (!window.google) return; // مكتبة جوجل مش اتحملت لأي سبب
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: onGoogleResponse,
    });
    const shell = document.querySelector('.google-btn-shell');
    const shellWidth = shell ? Math.round(shell.getBoundingClientRect().width) : 300;
    google.accounts.id.renderButton(
      document.getElementById('googleBtnContainer'),
      { theme: 'outline', size: 'large', width: shellWidth, type: 'standard' }
    );
  });
}

// ─── فيسبوك ────────────────────────────────────────────
// (fbAsyncInit اتعرّف فوق في الـ <head> قبل تحميل الـ SDK - راجع التعليق هناك)

function facebookSignIn() {
  if (typeof FB === 'undefined' || FACEBOOK_APP_ID.startsWith('YOUR_')) {
    const msg = 'Facebook login is not configured yet.';
    if (typeof showToast === 'function') showToast(msg, 'error'); else alert(msg);
    return;
  }
  FB.login(function (response) {
    if (response.authResponse) {
      api.facebookLogin(response.authResponse.accessToken)
        .then(handleSocialSuccess)
        .catch((err) => {
          if (typeof showToast === 'function') showToast(err.message, 'error');
          else alert(err.message);
        });
    }
  }, { scope: 'public_profile,email' });
}
</script>

</body>
</html>
